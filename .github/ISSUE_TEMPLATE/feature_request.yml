name: 功能建议
description: 提议玩法、系统、工具或工作流改进
title: "[Feature] "
labels:
  - enhancement
  - triage
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 描述当前痛点或玩家体验缺口。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 用可观察、可测试的条件描述完成标准。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 模块
      options:
        - Gameplay
        - Network
        - UI / UX
        - Art / Animation
        - Audio
        - Tools / Build
        - Documentation
    validations:
      required: true
