name: 缺陷报告
description: 报告可以复现的 Unity 或联机问题
title: "[Bug] "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        请先确认问题在最新 `main` 上仍可复现，并提供最小复现步骤。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 发生了什么，影响范围是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开场景 ...
        2. 进入 Play Mode ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: unity_version
    attributes:
      label: Unity 版本
      placeholder: 2022.3.57f1c2
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      multiple: true
      options:
        - Editor / Play Mode
        - Windows
        - macOS
        - Android
        - iOS
        - Dedicated Server
        - Host / Client 联机
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志、截图或录像
      description: 请粘贴完整报错和关键堆栈，不要只写“报错”。
    validations:
      required: false
